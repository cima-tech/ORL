<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - CIMA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header i {
            font-size: 3rem;
            color: #3b82f6;
            margin-bottom: 10px;
        }
        
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .form-section h3 {
            color: #3b82f6;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .checkbox-group input {
            width: auto;
        }
        
        .submit-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: block;
            margin: 40px auto 0;
        }
        
        .submit-btn:hover {
            background: #2563eb;
        }
        
        .message {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-user-plus"></i>
            <h1>Registro de Paciente</h1>
            <p>Complete el formulario para registrarse como paciente</p>
        </div>
        
        <form id="patientForm">
            <!-- Sección de Identificación -->
            <div class="form-section">
                <h3><i class="fas fa-id-card"></i> Identificación</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tipo de Documento *</label>
                        <select name="identificacion.documento_tipo" required>
                            <option value="">Seleccione...</option>
                            <option value="V">V - Venezolano</option>
                            <option value="E">E - Extranjero</option>
                            <option value="P">P - Pasaporte</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Número de Documento *</label>
                        <input type="text" name="identificacion.documento_numero" required>
                    </div>
                </div>
            </div>
            
            <!-- Sección de Nombres -->
            <div class="form-section">
                <h3><i class="fas fa-user"></i> Nombres Completos</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Primer Nombre *</label>
                        <input type="text" name="nombres.primer_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo Nombre</label>
                        <input type="text" name="nombres.segundo_nombre">
                    </div>
                    <div class="form-group">
                        <label>Primer Apellido *</label>
                        <input type="text" name="nombres.primer_apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Segundo Apellido</label>
                        <input type="text" name="nombres.segundo_apellido">
                    </div>
                </div>
            </div>
            
            <!-- Sección de Contacto -->
            <div class="form-section">
                <h3><i class="fas fa-phone"></i> Contacto</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Teléfono Principal *</label>
                        <input type="tel" name="contacto.tel_principal" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="contacto.email_principal">
                    </div>
                </div>
            </div>
            
            <!-- Sección de Datos Médicos Básicos -->
            <div class="form-section">
                <h3><i class="fas fa-heartbeat"></i> Datos Médicos</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" name="demografia.fecha_nacimiento">
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select name="demografia.genero">
                            <option value="">Seleccione...</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Alergias conocidas</label>
                    <textarea name="alertas_clinicas.alergias_detalle" rows="3" placeholder="Describa sus alergias..."></textarea>
                </div>
            </div>
            
            <!-- Consentimiento -->
            <div class="form-section">
                <h3><i class="fas fa-file-signature"></i> Consentimiento</h3>
                <div class="checkbox-group">
                    <input type="checkbox" id="consentimiento" required>
                    <label for="consentimiento">Autorizo el tratamiento de mis datos personales con fines médicos *</label>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">
                <i class="fas fa-paper-plane"></i> Enviar Registro
            </button>
        </form>
        
        <div id="message" class="message"></div>
    </div>
    
    <script>
        document.getElementById('patientForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {};
            
            // Convertir FormData a objeto
            for (let [key, value] of formData.entries()) {
                const keys = key.split('.');
                let obj = data;
                for (let i = 0; i < keys.length - 1; i++) {
                    if (!obj[keys[i]]) obj[keys[i]] = {};
                    obj = obj[keys[i]];
                }
                obj[keys[keys.length - 1]] = value;
            }
            
            // Agregar metadata
            data.fecha_registro = new Date().toISOString();
            data.origen = 'formulario_publico';
            
            try {
                // Guardar en localStorage (simulación de envío al buzón)
                const buzon = JSON.parse(localStorage.getItem('CIMA_BUZON_V1') || '[]');
                data.id = 'buzon_' + Date.now();
                buzon.push(data);
                localStorage.setItem('CIMA_BUZON_V1', JSON.stringify(buzon));
                
                // Mostrar mensaje de éxito
                document.getElementById('message').className = 'message success';
                document.getElementById('message').innerHTML = `
                    <i class="fas fa-check-circle" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>¡Registro exitoso!</h3>
                    <p>Sus datos han sido enviados al sistema. Será contactado pronto.</p>
                `;
                document.getElementById('message').style.display = 'block';
                
                // Limpiar formulario
                e.target.reset();
                
                // Ocultar mensaje después de 5 segundos
                setTimeout(() => {
                    document.getElementById('message').style.display = 'none';
                }, 5000);
                
            } catch (error) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').innerHTML = `
                    <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <h3>Error</h3>
                    <p>Ocurrió un error al procesar su registro. Intente nuevamente.</p>
                `;
                document.getElementById('message').style.display = 'block';
            }
        };
    </script>
</body>
</html>
