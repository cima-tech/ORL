<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIMA — Sistema ORL</title>
    
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>

<div id="err"></div>

<div class="toolbar-wrapper glass">
  <div class="toolbar">
    <div class="logo">
      <div class="main">CIMA</div>
      <div class="subtitle">Coordinador Inteligente de Monitoreo Asistido</div>
    </div>
    
    <div class="toolbar-group">
      <button id="btnNew" class="toolbar-btn"><i class="bi bi-file-earmark-plus"></i> Nueva HC</button>
      <button id="btnOpen" class="toolbar-btn"><i class="bi bi-folder2-open"></i> Abrir HC</button>
      <button id="btnClose" class="toolbar-btn"><i class="bi bi-save"></i> Guardar</button>
    </div>
    
    <div class="toolbar-group">
      <button id="btnAddConsulta" class="toolbar-btn"><i class="bi bi-plus-circle"></i> Consulta</button>
      <button id="btnDeleteLast" class="toolbar-btn"><i class="bi bi-trash"></i> Borrar Últ.</button>
    </div>
  </div>
</div>

<div class="container">
  
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="flex:1; display:flex; align-items:center; gap:15px;">
        <i class="bi bi-person-circle" style="font-size: 2rem; color:#60a5fa;"></i>
        <div>
            <div style="display:flex; gap:10px; align-items:baseline;">
                <h3 id="patient-header-name" style="margin:0; font-size:1.2rem; color:white;">Nuevo Paciente</h3>
                <span id="patient-age-display" class="badge">-- años</span>
            </div>
            <div style="font-size:0.75rem; color:#94a3b8; margin-top:2px;">
                <span id="patient-doc-info">Doc: ---</span> | <span id="patient-internal-id">ID: ---</span>
            </div>
            <div style="font-size:0.65rem; color:#64748b; margin-top:2px; display:flex; gap:10px;">
               <span id="patient-meta-created"></span>
               <span id="patient-meta-modified"></span>
            </div>
            <div id="patient-alerts-container" style="display:flex; gap:5px; margin-top:5px;"></div>
        </div>
      </div>
      <button class="patient-toggle-btn"><i class="bi bi-chevron-down"></i></button>
    </div>
    
    <div class="patient-details hidden" id="patient-form-container"></div>
  </div> 

  <div id="visitsContainer"></div>

  <div id="previewBar" class="hidden">
    <div style="display:flex; gap:15px; align-items:center;">
        <label style="color:#94a3b8; font-size:0.8rem;">Zoom</label>
        <input type="range" id="zoomRange" min="40" max="130" step="5" value="70" style="width:100px;">
        <span id="zoomVal" style="color:#60a5fa; font-size:0.8rem; font-weight:600;">70%</span>
        <button id="btnToggleSign" class="btn btn-ghost"><i class="bi bi-pen"></i> Firmar</button>
    </div>
    <div style="display:flex; gap:10px;">
        <button id="btnRefresh" class="btn btn-primary"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
        <button id="btnOpenExport" class="btn btn-success"><i class="bi bi-share"></i> Exportar</button>
    </div>
  </div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>

</div> 

<div id="searchModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:#60a5fa; margin-bottom:15px;">Buscar Paciente</h3>
    <input id="searchValue" class="form-input" placeholder="Nombre o Cédula..." style="margin-bottom:15px;">
    <div id="searchResultsList" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
    <div style="text-align:right;">
      <button id="btnCancelSearch" class="btn btn-ghost">Cancelar</button>
      <button id="btnDoSearch" class="btn btn-primary">Buscar</button>
    </div>
  </div>
</div>

<div id="exportModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:#60a5fa; text-align:center; margin-bottom:5px;">Compartir Documento</h3>
    <p id="exportFileName" style="text-align:center; color:#94a3b8; font-family:monospace; margin-bottom:20px; font-size:0.85rem;"></p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="btnShareWA" class="btn btn-success" style="justify-content:center;"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button id="btnShareMail" class="btn btn-danger" style="justify-content:center;"><i class="bi bi-envelope"></i> Email</button>
        <button id="btnDownload" class="btn btn-primary" style="grid-column:span 2; justify-content:center;"><i class="bi bi-download"></i> Descargar</button>
    </div>
    <div style="text-align:right; margin-top:15px;">
        <button id="btnCloseExport" class="btn btn-ghost">Cerrar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "patient": "./app/services/consultation/models/ORL-001/patient.js",
    "consult": "./app/services/consultation/models/ORL-001/consult.js",
    "informe": "./app/services/consultation/models/ORL-001/informe.js",
    "recipe": "./app/services/consultation/models/ORL-001/recipe-indicaciones.js",
    "export": "./app/services/consultation/models/ORL-001/export.js"
  }
}
</script>

<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { initializeNewPatient, togglePatientDetails, updatePatientHeader, calcularCampos, toggleConditionalFields } from 'patient';
    import { createVisitCard } from 'data';

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v2.0 - Init...");
        await loadUserConfig();
        initToolbarEvents();
        initializeNewPatient();

        // Bindings Globales
        window.togglePatientDetailsGlobal = togglePatientDetails;
        window.updatePatientHeaderGlobal = updatePatientHeader;
        window.$ = $;
        
        // Listener Formulario
        const formContainer = document.getElementById('patientForm');
        formContainer.addEventListener('change', (e) => {
            if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) updatePatientHeader();
            if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) calcularCampos();
            if(e.target.type === 'checkbox') toggleConditionalFields();
        });
        
        // Listener Visitas
        document.getElementById('visitsContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.visit-toggle-btn');
            if(btn) {
                const card = btn.closest('.visit-card');
                card.querySelector('.visit-body').classList.toggle('hidden');
                btn.querySelector('i').classList.toggle('bi-chevron-right');
                btn.querySelector('i').classList.toggle('bi-chevron-down');
            }
            if(e.target.closest('.btn-inf')) window.openDocGlobal('INF', e.target.closest('.visit-card').id);
            if(e.target.closest('.btn-rp')) window.openDocGlobal('RP', e.target.closest('.visit-card').id);
        });
        
        toggleConditionalFields();
    });
</script>

</body>
</html>
