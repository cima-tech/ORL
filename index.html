<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CIMA — Sistema ORL</title>
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>

<div id="login-screen" class="login-overlay">
    <div class="login-box glass">
        <div class="login-header">
            <div class="logo-big">CIMA</div>
            

<!-- AUTH DRAWER (pre-login) -->
<div id="authOverlay" class="drawer-overlay hidden">
  <div id="authDrawer" class="drawer glass">
    <div class="drawer-header">
      <div>
        <div class="logo-big" style="letter-spacing:2px;">CIMA</div>
        <div class="muted">Acceso y gestión de usuarios</div>
      </div>
      <button id="btnCloseAuth" class="icon-btn" title="Cerrar"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="drawer-tabs">
      <button id="tabLogin" class="tab-btn active">Iniciar sesión</button>
      <button id="tabCreate" class="tab-btn">Crear usuario</button>
    </div>

    <div id="authPaneLogin" class="drawer-pane">
      <div class="section-title">Recientes</div>
      <div id="recentUsersRow" class="recent-row"></div>

      <div class="section-title" style="margin-top:14px;">Todos los usuarios</div>
      <div id="user-list-container" class="user-list"></div>
    </div>

    <div id="authPaneCreate" class="drawer-pane hidden">
      <div class="section-title">Nuevo usuario</div>

      <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap:12px;">
        <div class="form-group"><label>ID (ej: u002)</label><input id="cu_id" class="form-input" placeholder="u002"></div>
        <div class="form-group"><label>Username</label><input id="cu_username" class="form-input" placeholder="tudraorl"></div>

        <div class="form-group"><label>Nombre visible</label><input id="cu_name" class="form-input" placeholder="Nombre Apellido"></div>
        <div class="form-group"><label>Título</label><input id="cu_title" class="form-input" placeholder="Dra."></div>

        <div class="form-group"><label>Especialidad</label><input id="cu_specialty" class="form-input" placeholder="Otorrinolaringología"></div>
        <div class="form-group"><label>Password (opcional)</label><input id="cu_password" type="password" class="form-input" placeholder="••••••••"></div>

        <div class="form-group span-2"><label>Modelo por defecto</label><select id="cu_model" class="form-input"></select></div>

        <div class="form-group"><label>Avatar</label><input id="cu_avatar" type="file" accept="image/*" class="form-input"></div>
        <div class="form-group"><label>Header</label><input id="cu_header" type="file" accept="image/*" class="form-input"></div>

        <div class="form-group"><label>Footer</label><input id="cu_footer" type="file" accept="image/*" class="form-input"></div>
        <div class="form-group"><label>Firma</label><input id="cu_signature" type="file" accept="image/*" class="form-input"></div>

        <div class="form-group"><label>Sello</label><input id="cu_stamp" type="file" accept="image/*" class="form-input"></div>
        <div class="form-group"><label>Ubicación</label><input id="cu_location" class="form-input" placeholder="Caracas, Venezuela"></div>
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
        <button id="btnDownloadUser" class="icon-btn" style="width:auto; padding:0 14px; font-size:0.9rem;"><i class="bi bi-download"></i> Descargar JSON</button>
        <button id="btnCreateUser" class="icon-btn" style="width:auto; padding:0 14px; font-size:0.9rem; background:var(--primary);"><i class="bi bi-person-plus"></i> Crear</button>
      </div>

      <div class="muted" style="margin-top:10px; line-height:1.35;">
        Nota: en modo estático, los nuevos usuarios se guardan en <code>localStorage</code>. También puedes descargar el <code>user.json</code> generado.
      </div>
    </div>
  </div>
</div>

<p>Sistema Clínico Integral</p>
        </div>
        <div class="login-content"><div id="user-list-container" class="user-list"></div></div>
    </div>
</div>

<div id="ui-mount-point"></div>

<div class="container">
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="flex:1; display:flex; align-items:center; gap:20px;">
        <i class="bi bi-person-circle" style="font-size: 2.5rem; color:var(--primary);"></i>
        <div>
            <div style="display:flex; gap:12px; align-items:baseline;">
                <h3 id="patient-header-name" style="margin:0; font-size:1.4rem; color:white;">Nuevo Paciente</h3>
                <span id="patient-age-display" class="badge" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:0.75rem;">-- años</span>
            </div>
            <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">
                <span id="patient-doc-info">Doc: ---</span> • <span id="patient-internal-id">ID: ---</span>
            </div>
        </div>
      </div>
      <button class="patient-toggle-btn"><i class="bi bi-chevron-down"></i></button>
    </div>
    <div class="patient-details hidden" id="patient-form-container" style="margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);"></div>
  </div> 

  <div id="visitsContainer" class="hidden"></div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>
</div> 

<div id="consoleDrawer">
    <div class="console-header">
        <span>SYSTEM LOG (Ctrl+Shift+L)</span>
        <span style="cursor:pointer;" onclick="document.getElementById('consoleDrawer').classList.remove('open')">▼</span>
    </div>
    <div id="consoleContent"></div>
</div>

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "engine": "./app/logic/engine.js",
    "service_loader": "./app/logic/service_loader.js",
    "start": "./app/logic/start.js"
  }
}
</script>

<script type="module">
    import { StartManager } from 'start';
    document.addEventListener('DOMContentLoaded', () => StartManager.init());
</script>

</body>
</html>
