<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA — Sistema Clínico Modular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modules/index.css">
    <style>
        /* Estilos temporales para login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
            color: #3b82f6;
        }
        
        .login-logo i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .login-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-btn:hover {
            background: #2563eb;
        }
        
        .login-error {
            color: #ef4444;
            margin-top: 10px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Contenedor de Login -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-stethoscope"></i>
                <h2>CIMA</h2>
                <p>Sistema Clínico Modular</p>
            </div>
            
            <form id="loginForm">
                <input type="text" id="username" class="login-input" placeholder="Usuario" required>
                <input type="password" id="password" class="login-input" placeholder="Contraseña" required>
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>
            
            <div id="loginError" class="login-error"></div>
            
            <div style="margin-top: 20px; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                <p>Usuario de prueba: user-001</p>
            </div>
        </div>
    </div>
    
    <!-- Aplicación Principal (oculta inicialmente) -->
    <div id="appContainer" class="hidden">
        <div class="background"></div>
        
        <!-- [HTML-001] DOCK SUPERIOR -->
        <div class="dock dock-doctor">
            <span id="btnHome"><i class="fas fa-home"></i> Inicio</span>
            <span>|</span>
            <span id="btnNewPatient"><i class="fas fa-user-plus"></i> Nuevo Paciente</span>
            <span>|</span>
            <span id="btnSearch" title="Buscar Paciente"><i class="fas fa-search"></i> Buscar</span>
            <span>|</span>
            <span id="btnAgenda"><i class="fas fa-calendar-alt"></i> Agenda</span>
            <span>|</span>
            <span id="btnBuzon" title="Buzón de Pacientes"><i class="fas fa-inbox"></i> Buzón</span>
            <span>|</span>
            <span id="btnTheme" title="Cambiar Tema"><i class="fas fa-adjust"></i> Tema</span>
            <span class="user-info" id="userInfoDisplay">Cargando...</span>
            <span>|</span>
            <span id="btnLogout" title="Cerrar Sesión"><i class="fas fa-sign-out-alt"></i> Salir</span>
        </div>
        
        <!-- [HTML-002] CONTENEDOR PRINCIPAL (Vacío inicialmente) -->
        <main class="doctor-container" id="mainContainer">
            <!-- Contenido se cargará dinámicamente -->
        </main>

        <!-- [HTML-003] MODAL DE EDICIÓN DE CONSULTA -->
        <div id="editModal" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="modal-title" id="modalTitle">Editar Consulta</span>
                    <button class="close-modal" onclick="window.app.closeModal()">&times;</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button class="action-btn secondary" onclick="window.app.closeModal()">Cancelar</button>
                    <button class="action-btn" id="btnSaveConsultation">Guardar Consulta</button>
                </div>
            </div>
        </div>

        <!-- [HTML-004] MODAL DE BÚSQUEDA -->
        <div id="searchModal" class="modal-overlay">
            <div class="modal-box" style="height:auto; max-height:80vh;">
                <div class="modal-header">
                    <span class="modal-title">Buscar Paciente</span>
                    <button class="close-modal" onclick="document.getElementById('searchModal').classList.remove('active')">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="searchInput" placeholder="Nombre o Cédula..." class="model-select" style="width:100%; padding:15px; font-size:1.1rem; margin-bottom:20px;">
                    <div id="searchResults"></div>
                </div>
            </div>
        </div>

        <!-- [HTML-005] MODAL DE BUZÓN -->
        <div id="buzonModal" class="modal-overlay">
            <div class="modal-box" style="height:auto; max-height:85vh; width:90%; max-width:1200px;">
                <div class="modal-header">
                    <span class="modal-title">Buzón de Pacientes Nuevos</span>
                    <button class="close-modal" onclick="document.getElementById('buzonModal').classList.remove('active')">&times;</button>
                </div>
                <div class="modal-body">
                    <div id="buzonList" style="min-height: 300px;">
                        <!-- Lista de pacientes pendientes -->
                    </div>
                </div>
            </div>
        </div>

        <!-- [HTML-006] DRAWER DE LOG -->
        <div id="logDrawer" class="log-drawer">
            <div class="log-header">
                <h3><i class="fas fa-terminal"></i> Log del Sistema</h3>
                <button class="close-log" onclick="window.app.closeLogDrawer()">&times;</button>
            </div>
            <div class="log-body">
                <div id="logContent" style="font-family: 'Courier New', monospace; font-size: 12px; white-space: pre-wrap;"></div>
            </div>
        </div>
    </div>

    <!-- [HTML-007] SCRIPT PRINCIPAL -->
    <script type="module" src="modules/index.js"></script>
</body>
</html>
