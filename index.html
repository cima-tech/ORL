<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIMA — Sistema ORL</title>
    
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>

<div id="ui-mount-point"></div>

<div class="container">
  
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="flex:1; display:flex; align-items:center; gap:20px;">
        <i class="bi bi-person-circle" style="font-size: 2.5rem; color:var(--primary);"></i>
        <div>
            <div style="display:flex; gap:12px; align-items:baseline;">
                <h3 id="patient-header-name" style="margin:0; font-size:1.4rem; color:white;">Nuevo Paciente</h3>
                <span id="patient-age-display" class="badge" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:0.75rem;">-- años</span>
            </div>
            <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">
                <span id="patient-doc-info">Doc: ---</span> • <span id="patient-internal-id">ID: ---</span>
            </div>
        </div>
      </div>
      <button class="patient-toggle-btn"><i class="bi bi-chevron-down"></i></button>
    </div>
    <div class="patient-details hidden" id="patient-form-container" style="margin-top:20px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);"></div>
  </div> 

  <div id="visitsContainer" class="hidden"></div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>

</div> 

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "engine": "./app/logic/engine.js",
    "service_loader": "./app/logic/service_loader.js"
  }
}
</script>

<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { ServiceLoader } from 'service_loader'; // Importamos el cargador

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v5.0 (Dynamic) - Init...");
        
        // 1. Cargar Configuración Usuario
        await loadUserConfig();
        
        // 2. CARGA DINÁMICA DE SERVICIOS (Aquí ocurre la magia)
        // Esto lee models.json y carga el JS correspondiente (ORL, Cardio, etc)
        const loaded = await ServiceLoader.init();
        if (!loaded) {
            alert("Error crítico cargando servicios médicos. Revise la consola.");
            return;
        }

        // 3. Dibujar Interfaz (Solo cuando los servicios existen)
        initToolbarEvents(); 

        // 4. Conexiones Globales usando el Servicio Cargado
        // Ya no importamos 'togglePatientDetails' directamente, lo sacamos del Loader
        const PatientService = ServiceLoader.get('patient');
        
        window.togglePatientDetailsGlobal = PatientService.togglePatientDetails;
        window.updatePatientHeaderGlobal = PatientService.updatePatientHeader;
        window.$ = $;

        // 5. Listeners Reactivos
        const formContainer = document.getElementById('patientForm');
        if(formContainer) {
            formContainer.addEventListener('change', (e) => {
                if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) PatientService.updatePatientHeader();
                if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) PatientService.calcularCampos();
                if(e.target.type === 'checkbox') PatientService.toggleConditionalFields();
            });
        }
        
        const visits = document.getElementById('visitsContainer');
        if(visits) {
            visits.addEventListener('click', (e) => {
                const btn = e.target.closest('.visit-toggle-btn');
                if(btn) {
                    const card = btn.closest('.visit-card');
                    card.querySelector('.visit-body').classList.toggle('hidden');
                    const icon = btn.querySelector('i');
                    icon.classList.toggle('bi-chevron-right');
                    icon.classList.toggle('bi-chevron-down');
                }
                // Nota: openDocGlobal en toolbar.js ya usa ServiceLoader internamente
                if(e.target.closest('.btn-inf')) window.openDocGlobal('INF', e.target.closest('.visit-card').id);
                if(e.target.closest('.btn-rp')) window.openDocGlobal('RP', e.target.closest('.visit-card').id);
            });
        }
        
        // Inicializar campos condicionales
        PatientService.toggleConditionalFields();
    });
</script>

</body>
</html>
