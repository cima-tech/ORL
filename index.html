<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA — Sistema Clínico Modular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modules/index.css">
</head>
<body>
    <div class="background"></div>
    
    <!-- [HTML-001] DOCK SUPERIOR -->
    <div class="dock dock-doctor">
        <span id="btnHome"><i class="fas fa-home"></i> Inicio</span>
        <span>|</span>
        <span id="btnNewPatient"><i class="fas fa-user-plus"></i> Nuevo Paciente</span>
        <span>|</span>
        <!-- Buscar Paciente (Aquí) -->
        <span id="btnSearch" title="Buscar Paciente"><i class="fas fa-search"></i> Buscar Paciente</span>
        <span>|</span>
        <span id="btnAgenda"><i class="fas fa-calendar-alt"></i> Agenda</span>
        <span>|</span>
        <!-- Switch Light/Dark -->
        <span id="btnTheme" title="Cambiar Tema"><i class="fas fa-adjust"></i> Tema</span>
        <span class="user-info" id="userInfoDisplay">Cargando usuario...</span>
    </div>
    
    <!-- [HTML-002] CONTENEDOR PRINCIPAL -->
    <main class="doctor-container" id="mainContainer">
        
        <!-- Vista Dashboard (Por defecto) -->
        <div id="dashboardView">
            <div style="text-align:center; padding:50px; color:var(--color-text-dim);">
                <h2>Bienvenido a CIMA</h2>
                <p>Seleccione un paciente para comenzar.</p>
                <div class="new-consultation" style="margin-top:20px; display:inline-block;" onclick="window.app.showSearchModal()">
                    <i class="fas fa-search"></i>
                    <h3>Buscar Paciente</h3>
                </div>
            </div>
        </div>

        <!-- Vista Paciente (Oculta por defecto) -->
        <div id="patientView" class="hidden">
            
            <!-- Sección Paciente -->
            <div class="collapsible-section" id="patientSection">
                <div class="section-header" onclick="window.app.toggleSection('patientSection')">
                    <div class="section-title">
                        <i class="fas fa-user-injured"></i>
                        <span id="patientHeaderTitle">PACIENTE: ...</span>
                    </div>
                    <button class="section-toggle"><i class="fas fa-chevron-down"></i></button>
                </div>
                <div class="section-content expanded">
                    <div class="section-content-inner">
                        <!-- Datos inyectados vía JS -->
                        <div id="patientInfoContainer" class="patient-info-grid"></div>
                        <div class="actions-row">
                            <button class="action-btn" onclick="window.app.editCurrentPatient()">
                                <i class="fas fa-edit"></i> Editar Ficha
                            </button>
                            <button class="action-btn secondary" onclick="window.app.viewFullHistory()">
                                <i class="fas fa-file-medical-alt"></i> Historia Completa
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Sección Consultas -->
            <div class="collapsible-section" id="consultationsSection">
                <div class="section-header" onclick="window.app.toggleSection('consultationsSection')">
                    <div class="section-title">
                        <i class="fas fa-file-medical"></i>
                        <span id="consultationsCount">CONSULTAS (0)</span>
                    </div>
                    <button class="section-toggle"><i class="fas fa-chevron-down"></i></button>
                </div>
                <div class="section-content expanded">
                    <div class="section-content-inner">
                        <div id="consultationListContainer" class="consultations-list">
                            <!-- Lista inyectada vía JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón Flotante Nueva Consulta -->
            <div class="new-consultation" onclick="window.app.openNewConsultationUI()">
                <i class="fas fa-plus-circle"></i>
                <h3>Nueva Consulta</h3>
                <p>Iniciar nueva consulta médica con este paciente</p>
                <p style="margin-top:10px;">
                    Modelo: 
                    <select id="newConsultModelSelect" class="model-select">
                        <!-- LISTA DE MODELOS (Definida en HTML para facilidad) -->
                        <option value="ORL-001">ORL-001 - Consulta ORL</option>
                        <option value="MEDGEN-001">MEDGEN-001 - Consulta General</option>
                        <option value="PEDI-001">PEDI-001 - Consulta Pediátrica</option>
                    </select>
                </p>
            </div>

        </div>
    </main>

    <!-- [HTML-003] MODAL DE EDICIÓN DE CONSULTA -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Editar Consulta</span>
                <button class="close-modal" onclick="window.app.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Aquí se inyectará el HTML del modelo dinámicamente -->
            </div>
            <div class="modal-footer">
                <button class="action-btn secondary" onclick="window.app.closeModal()">Cancelar</button>
                <button class="action-btn" id="btnSaveConsultation">Guardar Consulta</button>
            </div>
        </div>
    </div>

    <!-- [HTML-004] MODAL DE BÚSQUEDA -->
    <div id="searchModal" class="modal-overlay">
        <div class="modal-box" style="height:auto; max-height:80vh;">
            <div class="modal-header">
                <span class="modal-title">Buscar Paciente</span>
                <button class="close-modal" onclick="document.getElementById('searchModal').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="searchInput" placeholder="Nombre o Cédula..." class="model-select" style="width:100%; padding:15px; font-size:1.1rem; margin-bottom:20px;">
                <div id="searchResults"></div>
            </div>
        </div>
    </div>

    <!-- [HTML-005] SCRIPT PRINCIPAL -->
    <script type="module" src="modules/index.js"></script>
</body>
</html>
