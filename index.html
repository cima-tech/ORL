<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA — ORL System</title>
    
    <!-- 1. CARGAR CSS (Glassmorphism & Tema) -->
    <link rel="stylesheet" href="modules/index.css">

    <!-- Librería externa para PDF -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- 2. CARGAR MÓDULOS JS EN ORDEN -->
    <script src="modules/consultmodules/ORL-001.js"></script> <!-- Expone window.ORL_MODULE -->
    <script type="module" src="modules/index.js"></script> <!-- Carga PatientProfile e inicia App -->
</head>
<body>

<div class="app-container">
    
    <!-- TOOLBAR -->
    <header class="glass toolbar">
        <div class="toolbar-group">
            <div class="logo">C.I.M.A.</div>
        </div>
        <div class="toolbar-group">
            <button id="btn-new" class="btn btn-icon" title="Nueva HC">+</button>
            <button id="btn-save" class="btn btn-secondary btn-icon" title="Guardar">💾</button>
            <button id="btn-load" class="btn btn-secondary btn-icon" title="Cargar">📂</button>
        </div>
        <div class="toolbar-group">
            <button id="btn-theme" class="btn btn-icon" title="Tema">🌗</button>
        </div>
    </header>

    <!-- PERFIL DEL PACIENTE -->
    <section id="patient-module" class="glass" style="padding: 20px;">
        <div class="tabs">
            <button class="tab-btn active" onclick="CIMA_App.switchTab('tab-ident', this)">Identificación</button>
            <button class="tab-btn" onclick="CIMA_App.switchTab('tab-demo', this)">Demografía</button>
            <button class="tab-btn" onclick="CIMA_App.switchTab('tab-contact', this)">Contacto</button>
            <button class="tab-btn" onclick="CIMA_App.switchTab('tab-social', this)">Redes</button>
            <button class="tab-btn" onclick="CIMA_App.switchTab('tab-antec', this)">Antecedentes</button>
        </div>

        <!-- TABS CONTENT -->
        <div id="tab-ident" class="tab-content">
            <div class="grid">
                <div><label class="label">ID Paciente</label><input id="pp-id" oninput="CIMA_App.syncProfileFromDOM()"></div>
                <div><label class="label">Código CIMA</label><input id="pp-code"></div>
                <div><label class="label">Primer Nombre</label><input id="pp-name1"></div>
                <div><label class="label">Segundo Nombre</label><input id="pp-name2"></div>
                <div><label class="label">Primer Apellido</label><input id="pp-surname1"></div>
                <div><label class="label">Segundo Apellido</label><input id="pp-surname2"></div>
            </div>
        </div>

        <div id="tab-demo" class="tab-content hidden">
            <div class="grid">
                <div><label class="label">Fecha Nacimiento</label><input type="date" id="pp-dob" onchange="CIMA_App.syncProfileFromDOM()"></div>
                <div><label class="label">Edad</label><input id="pp-age" readonly style="background:rgba(0,0,0,0.05)"></div>
                <div><label class="label">Género</label><select id="pp-gender"><option>Masculino</option><option>Femenino</option></select></div>
                <div><label class="label">Peso (kg)</label><input type="number" id="pp-weight" step="0.1"></div>
                <div><label class="label">Talla (cm)</label><input type="number" id="pp-height" step="0.1"></div>
                <div><label class="label">IMC</label><input id="pp-imc" readonly style="background:rgba(0,0,0,0.05)"></div>
            </div>
        </div>

        <div id="tab-contact" class="tab-content hidden">
            <div class="grid">
                <div><label class="label">Teléfono</label><input id="pp-phone"></div>
                <div><label class="label">Email</label><input id="pp-email"></div>
                <div class="full-width"><label class="label">Dirección</label><input id="pp-address"></div>
            </div>
        </div>

        <div id="tab-social" class="tab-content hidden">
            <div class="grid">
                <div><label class="label">Instagram</label><input id="pp-insta"></div>
                <div><label class="label">Twitter / X</label><input id="pp-twitter"></div>
            </div>
        </div>

        <div id="tab-antec" class="tab-content hidden">
            <div class="section-box">
                <label class="label">Antecedentes Personales (Seleccionar)</label>
                <div class="chips">
                    <div class="chip" onclick="this.classList.toggle('on')">Hipertensión</div>
                    <div class="chip" onclick="this.classList.toggle('on')">Diabetes</div>
                    <div class="chip" onclick="this.classList.toggle('on')">Asma</div>
                    <div class="chip" onclick="this.classList.toggle('on')">Cardiopatías</div>
                    <div class="chip" onclick="this.classList.toggle('on')">Tiroides</div>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTROLES DE VISITAS -->
    <div class="glass" style="padding: 12px 20px; display:flex; gap:10px;">
        <button id="btn-add-visit" class="btn">+ Nueva Consulta</button>
        <button id="btn-del-visit" class="btn btn-secondary">Eliminar Última</button>
    </div>

    <!-- CONTENEDOR DE VISITAS -->
    <div id="visits-container"></div>

    <!-- PREVIEW BAR -->
    <div id="preview-bar" class="glass hidden" style="padding: 10px 20px; display:flex; justify-content:space-between; align-items:center;">
        <div class="flex-row">
            <select id="doc-type" class="btn-secondary" style="width:auto;">
                <option value="INF">Informe Médico</option>
                <option value="RP">Receta</option>
            </select>
        </div>
        <div class="flex-row">
            <button id="btn-sig" class="btn btn-secondary" title="Firma">🖊️</button>
            <button id="btn-export" class="btn">Exportar PNG</button>
        </div>
    </div>

    <!-- PREVIEW AREA -->
    <div id="preview-container" class="preview-container">
        <div id="doc-preview"></div>
    </div>

</div>

<!-- Input oculto para carga de archivos -->
<input type="file" id="file-input" accept=".json" style="display:none">

</body>
</html>
