<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA — Sistema ORL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/orl-styles.css">
</head>
<body>

<div id="err"></div>

<!-- Barra de herramientas -->
<div class="toolbar-wrapper glass">
    <div class="toolbar">
        <div class="logo">
            <div class="main">C.I.M.A.</div>
            <div class="subtitle">Coordinador Inteligente de Monitoreo Asistido</div>
        </div>
        
        <div class="toolbar-group">
            <button id="btnNew" class="toolbar-btn">
                <i class="bi bi-file-earmark-plus"></i> Nueva HC
            </button>
            <button id="btnOpen" class="toolbar-btn">
                <i class="bi bi-folder2-open"></i> Abrir HC
            </button>
            <button id="btnClose" class="toolbar-btn warning">
                <i class="bi bi-x-circle"></i> Cerrar HC
            </button>
        </div>
        
        <div class="toolbar-group">
            <button id="btnAddConsulta" class="toolbar-btn primary">
                <i class="bi bi-plus-circle"></i> Agregar Consulta
            </button>
            <button id="btnDeleteLast" class="toolbar-btn danger">
                <i class="bi bi-trash"></i> Eliminar Última
            </button>
            <span class="badge" id="tplStatus">✓ Plantillas Cargadas</span>
        </div>
    </div>
</div>

<!-- Contenedor principal -->
<div class="container">
    <!-- Formulario del paciente -->
    <div id="patientForm" class="card hidden">
        <div class="row">
            <div class="col">
                <label class="form-label">ID (ej: V-12345) *</label>
                <input id="patient_id" class="form-input" placeholder="X-123456" required>
            </div>
            <div class="col">
                <label class="form-label">Nombre Completo *</label>
                <input id="full_name" class="form-input" placeholder="Nombre y apellido" required>
            </div>
            <div class="col">
                <label class="form-label">Fecha de Nacimiento</label>
                <input id="birthdate" type="date" class="form-input">
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label class="form-label">Sexo</label>
                <select id="sex" class="form-select">
                    <option value="">Seleccionar</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </div>
            <div class="col">
                <label class="form-label">Ocupación</label>
                <input id="ocupacion" class="form-input">
            </div>
            <div class="col">
                <label class="form-label">Teléfono</label>
                <input id="phone" class="form-input" placeholder="+58 424 1090979">
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-input" placeholder="paciente@email.com">
            </div>
            <div class="col">
                <label class="form-label">¿Tiene seguro médico?</label>
                <div style="margin-top: 8px;">
                    <input type="checkbox" id="has_seguro"> 
                    <label for="has_seguro" style="margin-left: 8px;">Sí, tiene seguro</label>
                </div>
            </div>
            <div class="col seguro-box hidden" id="seguro_box">
                <label class="form-label">Compañía de seguro</label>
                <input id="seguro_company" class="form-input">
            </div>
        </div>
    </div>

    <!-- Contenedor para React -->
    <div id="orl-consult-container"></div>

    <!-- Barra de previsualización (oculta inicialmente) -->
    <div id="previewBar" class="card hidden">
        <div class="row" style="align-items: center;">
            <div class="col" style="flex: 1;">
                <label class="form-label">Zoom del documento</label>
                <input type="range" id="zoomRange" min="40" max="120" step="5" value="60" class="form-input">
                <span id="zoomVal" style="font-weight: 600; margin-left: 10px;">60%</span>
            </div>
            <div class="col" style="flex: 0 0 auto;">
                <div style="display: flex; gap: 10px;">
                    <button id="btnSigToggle" class="btn btn-ghost">
                        <i class="bi bi-pen"></i> Firma
                    </button>
                    <button id="btnRefresh" class="btn btn-primary">
                        <i class="bi bi-arrow-clockwise"></i> Actualizar
                    </button>
                    <button id="btnExport" class="btn btn-success">
                        <i class="bi bi-download"></i> Exportar PNG
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Previsualización del documento -->
    <div id="previewShell" class="preview-shell hidden">
        <div id="docPreview"></div>
    </div>
</div>

<!-- Modales -->
<div id="searchModal" class="modal-overlay">
    <div class="modal-box glass">
        <div class="modal-header">Buscar Historia Clínica</div>
        <div class="modal-body">
            <div class="row">
                <div class="col">
                    <label class="form-label">Buscar por:</label>
                    <select id="searchType" class="form-select">
                        <option value="patient_id">Cédula / ID</option>
                        <option value="full_name">Nombre completo</option>
                        <option value="email">Email</option>
                        <option value="phone">Teléfono</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label class="form-label">Valor a buscar:</label>
                    <input id="searchValue" class="form-input" placeholder="Ingrese el valor...">
                </div>
            </div>
            <div id="searchResults" class="hidden" style="margin-top: 20px; max-height: 300px; overflow-y: auto;">
                <div style="font-weight: 700; margin-bottom: 10px; color: var(--primary);">Resultados encontrados:</div>
                <div id="searchResultsList"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="btnCancelSearch" class="btn btn-ghost">Cancelar</button>
            <button id="btnDoSearch" class="btn btn-primary">Buscar</button>
        </div>
    </div>
</div>

<div id="exportModal" class="modal-overlay">
    <div class="modal-box glass">
        <div class="modal-header">Documento Exportado</div>
        <div class="modal-body">
            <div style="background: #e8f5e9; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
                <div style="font-size: 48px; color: var(--success); margin-bottom: 10px;">
                    <i class="bi bi-check-circle"></i>
                </div>
                <div style="font-weight: 600; font-size: 16px; color: var(--success);">Archivo guardado en Descargas</div>
                <div id="pngFilename" style="color: #666; margin-top: 5px;"></div>
            </div>
            <div style="text-align: center;">
                <button onclick="$('#exportModal').classList.remove('active')" class="btn btn-primary">
                    <i class="bi bi-check"></i> Continuar trabajando
                </button>
            </div>
        </div>
    </div>
</div>

<div id="shareModal" class="modal-overlay">
    <div class="modal-box glass">
        <div class="modal-header">Compartir Documento</div>
        <div class="modal-body">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button onclick="copyLinkFromShare()" class="btn btn-ghost" style="justify-content: flex-start;">
                    <i class="bi bi-link-45deg"></i> Copiar enlace al portapapeles
                </button>
                <button onclick="shareViaWhatsApp()" class="btn btn-ghost" style="justify-content: flex-start;">
                    <i class="bi bi-whatsapp" style="color: #25D366;"></i> Enviar por WhatsApp
                </button>
                <button onclick="shareViaEmail()" class="btn btn-ghost" style="justify-content: flex-start;">
                    <i class="bi bi-envelope"></i> Enviar por Email
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="$('#shareModal').classList.remove('active')" class="btn btn-ghost">Cerrar</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- Nuestros scripts -->
<script type="text/babel" data-presets="react" src="js/orl-system-core.js"></script>
<script type="text/babel" data-presets="react" src="service/consult/ORL-001.jsx"></script>

<script>
// Inicialización del sistema
document.addEventListener('DOMContentLoaded', function() {
    // Exponer funciones globales necesarias para los modales (simplificado)
    window.$ = function(selector) { return document.querySelector(selector); };
    window.$$ = function(selector) { return Array.from(document.querySelectorAll(selector)); };
    
    // Inicializar el sistema (esto se hará en orl-system-core.js)
    // Por ahora, solo mostramos el formulario del paciente
    $('#patientForm').classList.remove('hidden');
    
    // Configurar el checkbox de seguro
    $('#has_seguro').addEventListener('change', function(e) {
        $('#seguro_box').classList.toggle('hidden', !e.target.checked);
    });
    
    // Inicializar la barra de herramientas (la lógica está en orl-system-core.js)
    // Nota: La función initializeORLSystem se llama desde orl-system-core.js
});
</script>

</body>
</html>
