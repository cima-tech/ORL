<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { initializeNewPatient, togglePatientDetails, updatePatientHeader, calcularCampos, toggleConditionalFields } from 'patient';

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v4.0 - Reactive UI Init...");
        await loadUserConfig();
        
        // 1. Render inicial (Barra limpia)
        initToolbarEvents(); 
        
        // NO iniciamos paciente. Pantalla vacía.
        // initializeNewPatient(); 

        window.togglePatientDetailsGlobal = togglePatientDetails;
        window.updatePatientHeaderGlobal = updatePatientHeader;
        window.$ = $;

        // ... Listeners igual que antes ...
        const formContainer = document.getElementById('patientForm');
        formContainer.addEventListener('change', (e) => {
            if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) updatePatientHeader();
            if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) calcularCampos();
            if(e.target.type === 'checkbox') toggleConditionalFields();
        });
        
        document.getElementById('visitsContainer').addEventListener('click', (e) => {
            // ... logica toggle visit ...
            const btn = e.target.closest('.visit-toggle-btn');
            if(btn) {
                const card = btn.closest('.visit-card');
                card.querySelector('.visit-body').classList.toggle('hidden');
                const icon = btn.querySelector('i');
                icon.classList.toggle('bi-chevron-right');
                icon.classList.toggle('bi-chevron-down');
            }
            if(e.target.closest('.btn-inf')) window.openDocGlobal('INF', e.target.closest('.visit-card').id);
            if(e.target.closest('.btn-rp')) window.openDocGlobal('RP', e.target.closest('.visit-card').id);
        });
        toggleConditionalFields();
    });
</script>
</body>
</html>
