<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIMA — Sistema ORL</title>
    
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>

<div id="err"></div>

<div class="toolbar-wrapper glass">
  <div class="toolbar-content">
    
    <div class="toolbar-left">
        <div class="logo">
          <div class="main">CIMA</div>
          <div class="subtitle">ORL v2.0</div>
        </div>
        
        <div class="toolbar-divider"></div>

        <div class="action-group">
          <button id="btnNew" class="glass-btn" title="Nueva Historia"><i class="bi bi-file-earmark-plus"></i> <span class="btn-label">Nueva</span></button>
          <button id="btnOpen" class="glass-btn" title="Abrir Historia"><i class="bi bi-folder2-open"></i> <span class="btn-label">Abrir</span></button>
          <button id="btnSave" class="glass-btn" title="Guardar Cambios"><i class="bi bi-save"></i> <span class="btn-label">Guardar</span></button>
          
          <div class="toolbar-separator"></div>

          <button id="btnAddConsulta" class="glass-btn accent" title="Agregar Consulta"><i class="bi bi-plus-circle"></i> Consulta</button>
          
          <button id="btnCloseStory" class="glass-btn danger-glass" title="Guardar y Cerrar Historia">
              <i class="bi bi-x-lg"></i> Cerrar
          </button>
        </div>
    </div>
    
    <div class="toolbar-right">
        <button class="glass-btn icon-only" title="Agenda (Próximamente)"><i class="bi bi-calendar-week"></i></button>
        <button class="glass-btn icon-only" title="Facturación (Próximamente)"><i class="bi bi-currency-dollar"></i></button>
        
        <div class="toolbar-separator"></div>

        <div class="user-menu-container">
            <button id="btnUserAvatar" class="user-avatar-btn">
                <span>DR</span>
            </button>

            <div id="userDropdown" class="user-dropdown glass hidden">
                <div class="dropdown-header">
                    <p class="user-name">Dr. Usuario</p>
                    <p class="user-role">Otorrinolaringología</p>
                </div>
                
                <ul class="dropdown-list">
                    <li><button><i class="bi bi-layout-sidebar"></i> Alternar Sidebar</button></li>
                    
                    <li class="switch-item">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <i class="bi bi-palette"></i> Tema
                        </div>
                        <div class="smart-switch" id="themeSwitch">
                            <div class="switch-handle"></div>
                            <div class="switch-icons">
                                <i class="bi bi-sun-fill text-xs text-yellow-500"></i>
                                <i class="bi bi-moon-fill text-xs text-blue-300"></i>
                            </div>
                        </div>
                    </li>
                    
                    <li><button><i class="bi bi-gear"></i> Configuración</button></li>
                    <li class="divider"></li>
                    <li><button class="text-danger"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                </ul>
            </div>
        </div>
    </div>

  </div>
</div>

<div class="container">
  
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="flex:1; display:flex; align-items:center; gap:15px;">
        <i class="bi bi-person-circle" style="font-size: 2.5rem; color:var(--accent); filter: drop-shadow(0 0 5px rgba(96,165,250,0.5));"></i>
        <div>
            <div style="display:flex; gap:10px; align-items:baseline;">
                <h3 id="patient-header-name" style="margin:0; font-size:1.3rem; color:white; text-shadow:0 2px 4px rgba(0,0,0,0.5);">Nuevo Paciente</h3>
                <span id="patient-age-display" class="glass-badge">-- años</span>
            </div>
            <div style="font-size:0.75rem; color:#cbd5e1; margin-top:4px;">
                <span id="patient-doc-info">Doc: ---</span> | <span id="patient-internal-id">ID: ---</span>
            </div>
        </div>
      </div>
      <button class="collapse-btn-glass"><i class="bi bi-chevron-down"></i></button>
    </div>
    
    <div class="patient-details hidden" id="patient-form-container"></div>
  </div> 

  <div id="visitsContainer"></div>

  <div id="previewBar" class="glass-floating hidden">
    <div class="preview-controls">
        <label class="zoom-label"><i class="bi bi-search"></i></label>
        <input type="range" id="zoomRange" min="40" max="130" step="5" value="70" class="styled-range">
        <span id="zoomVal">70%</span>
        <div class="v-separator"></div>
        <button id="btnToggleSign" class="glass-btn-sm"><i class="bi bi-pen"></i> Firmar</button>
    </div>
    <div class="preview-actions">
        <button id="btnRefresh" class="glass-btn-sm primary"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
        <button id="btnOpenExport" class="glass-btn-sm success"><i class="bi bi-share-fill"></i> Exportar</button>
        <button id="btnClosePreview" class="glass-btn-sm danger-text" title="Cerrar Preview"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>

</div> 

<div id="searchModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:var(--accent); margin-bottom:15px;">Buscar Paciente</h3>
    <input id="searchValue" class="form-input" placeholder="Nombre o Cédula..." style="margin-bottom:15px;">
    <div id="searchResultsList" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
    <div style="text-align:right; display:flex; gap:10px; justify-content:flex-end;">
      <button id="btnCancelSearch" class="glass-btn">Cancelar</button>
      <button id="btnDoSearch" class="glass-btn primary">Buscar</button>
    </div>
  </div>
</div>

<div id="exportModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:var(--accent); text-align:center; margin-bottom:5px;">Compartir Documento</h3>
    <p id="exportFileName" style="text-align:center; color:#94a3b8; font-family:monospace; margin-bottom:20px; font-size:0.85rem;"></p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="btnShareWA" class="btn btn-success" style="justify-content:center;"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button id="btnShareMail" class="btn btn-danger" style="justify-content:center;"><i class="bi bi-envelope"></i> Email</button>
        <button id="btnDownload" class="btn btn-primary" style="grid-column:span 2; justify-content:center;"><i class="bi bi-download"></i> Descargar Imagen</button>
    </div>
    <div style="text-align:right; margin-top:15px;">
        <button id="btnCloseExport" class="glass-btn">Cerrar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "patient": "./app/services/consultation/models/ORL-001/patient.js",
    "consult": "./app/services/consultation/models/ORL-001/consult.js",
    "informe": "./app/services/consultation/models/ORL-001/informe.js",
    "recipe": "./app/services/consultation/models/ORL-001/recipe-indicaciones.js",
    "export": "./app/services/consultation/models/ORL-001/export.js"
  }
}
</script>

<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { initializeNewPatient, togglePatientDetails, updatePatientHeader, calcularCampos, toggleConditionalFields } from 'patient';

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v2.1 - Glass UI");
        await loadUserConfig();
        initToolbarEvents();
        initializeNewPatient();

        // Bindings Globales
        window.togglePatientDetailsGlobal = togglePatientDetails;
        window.updatePatientHeaderGlobal = updatePatientHeader;
        window.$ = $;
        
        // Listener Formulario
        const formContainer = document.getElementById('patientForm');
        formContainer.addEventListener('change', (e) => {
            if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) updatePatientHeader();
            if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) calcularCampos();
            if(e.target.type === 'checkbox') toggleConditionalFields();
        });
        
        // Listener Visitas
        document.getElementById('visitsContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.visit-toggle-btn');
            if(btn) {
                const card = btn.closest('.visit-card');
                card.querySelector('.visit-body').classList.toggle('hidden');
                btn.querySelector('i').classList.toggle('bi-chevron-right');
                btn.querySelector('i').classList.toggle('bi-chevron-down');
            }
            if(e.target.closest('.btn-inf')) window.openDocGlobal('INF', e.target.closest('.visit-card').id);
            if(e.target.closest('.btn-rp')) window.openDocGlobal('RP', e.target.closest('.visit-card').id);
        });
        
        toggleConditionalFields();
    });
</script>

</body>
</html>
