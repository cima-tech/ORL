<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA — Sistema Clínico Modular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modules/index.css">
    <style>
        /* Estilos para el efecto glass mejorado */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                linear-gradient(135deg, rgba(10, 14, 23, 0.95) 0%, rgba(26, 31, 46, 0.95) 100%);
            z-index: -2;
        }
        
        .glass-layer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-layer-heavy {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <!-- Overlay para fondos -->
    <div class="background-overlay"></div>
    
    <!-- Barra superior minimalista -->
    <div class="main-dock glass-layer-heavy">
        <div class="dock-left">
            <span class="logo" id="btnHome">
                <i class="fas fa-stethoscope"></i>
                <span>CIMA</span>
            </span>
        </div>
        
        <div class="dock-center" id="mainNav">
            <!-- Se llenará dinámicamente según autenticación -->
        </div>
        
        <div class="dock-right">
            <span id="btnTheme" title="Cambiar tema">
                <i class="fas fa-adjust"></i>
            </span>
        </div>
    </div>
    
    <!-- Contenido principal (siempre vacío inicialmente) -->
    <main id="mainContent" class="main-content">
        <!-- Se llenará dinámicamente según acciones -->
    </main>
    
    <!-- Drawer de Login (slide desde derecha) -->
    <div id="loginDrawer" class="drawer right-drawer">
        <div class="drawer-header glass-layer">
            <h3><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h3>
            <button class="close-drawer" onclick="CIMA.closeDrawer('loginDrawer')">&times;</button>
        </div>
        <div class="drawer-body">
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="username" placeholder="tudraorl" autocomplete="username">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
                <div class="auth-links">
                    <a href="#" onclick="CIMA.switchDrawer('loginDrawer', 'patientAccessDrawer')">
                        <i class="fas fa-user-injured"></i> Acceso Paciente
                    </a>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Drawer de Acceso Paciente -->
    <div id="patientAccessDrawer" class="drawer right-drawer">
        <div class="drawer-header glass-layer">
            <h3><i class="fas fa-user-injured"></i> Área del Paciente</h3>
            <button class="close-drawer" onclick="CIMA.closeDrawer('patientAccessDrawer')">&times;</button>
        </div>
        <div class="drawer-body">
            <div class="patient-options">
                <button class="option-btn" onclick="CIMA.switchDrawer('patientAccessDrawer', 'patientLoginDrawer')">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Iniciar Sesión</span>
                    <small>Pacientes registrados</small>
                </button>
                <button class="option-btn" onclick="CIMA.switchDrawer('patientAccessDrawer', 'patientRegisterDrawer')">
                    <i class="fas fa-user-plus"></i>
                    <span>Nuevo Registro</span>
                    <small>Completar ficha completa</small>
                </button>
                <button class="option-btn" onclick="CIMA.switchDrawer('patientAccessDrawer', 'patientRequestDrawer')">
                    <i class="fas fa-file-medical"></i>
                    <span>Solicitar Documentos</span>
                    <small>Informes, certificados</small>
                </button>
            </div>
            <div class="auth-links">
                <a href="#" onclick="CIMA.switchDrawer('patientAccessDrawer', 'loginDrawer')">
                    <i class="fas fa-user-md"></i> Acceso Médico
                </a>
            </div>
        </div>
    </div>
    
    <!-- Drawer de Registro Paciente (con formulario completo) -->
    <div id="patientRegisterDrawer" class="drawer right-drawer wide-drawer">
        <div class="drawer-header glass-layer">
            <h3><i class="fas fa-user-plus"></i> Registro Completo de Paciente</h3>
            <button class="close-drawer" onclick="CIMA.closeDrawer('patientRegisterDrawer')">&times;</button>
        </div>
        <div class="drawer-body">
            <div id="patientFormContainer"></div>
        </div>
    </div>
    
    <!-- Drawer de Log del Sistema -->
    <div id="logDrawer" class="drawer right-drawer">
        <div class="drawer-header glass-layer">
            <h3><i class="fas fa-terminal"></i> Log del Sistema</h3>
            <button class="close-drawer" onclick="CIMA.closeDrawer('logDrawer')">&times;</button>
        </div>
        <div class="drawer-body">
            <div class="log-content" id="logContent">
                <!-- Log entries aparecerán aquí -->
            </div>
        </div>
    </div>
    
    <!-- Overlay para cerrar drawers -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="CIMA.closeAllDrawers()"></div>
    
    <!-- Modales existentes (mantenidos para compatibilidad) -->
    <div id="searchModal" class="modal-overlay">
        <!-- Mantener igual -->
    </div>
    
    <div id="editModal" class="modal-overlay">
        <!-- Mantener igual -->
    </div>
    
    <!-- Nuevo Modal para Documentos -->
    <div id="documentModal" class="modal-overlay">
        <div class="modal-box document-preview">
            <div class="modal-header glass-layer">
                <span class="modal-title" id="documentTitle">Documento</span>
                <div class="document-actions">
                    <select id="documentType" class="doc-type-select">
                        <option value="informe">Informe Médico</option>
                        <option value="recipe">Recipe e Indicaciones</option>
                        <option value="laboratorio">Orden de Laboratorio</option>
                        <option value="quirurgica">Orden Quirúrgica</option>
                        <option value="referencia">Referencia/Interconsulta</option>
                        <option value="constancia">Constancia Médica</option>
                    </select>
                    <button class="action-btn" onclick="CIMA.addSignature()">
                        <i class="fas fa-signature"></i> Firma
                    </button>
                    <button class="action-btn" onclick="CIMA.addStamp()">
                        <i class="fas fa-stamp"></i> Sello
                    </button>
                    <button class="close-modal" onclick="CIMA.closeModal('documentModal')">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="documentBody">
                <!-- Vista previa del documento -->
                <div class="document-paper" id="documentPaper">
                    <!-- Contenido del documento -->
                </div>
            </div>
            <div class="modal-footer glass-layer">
                <button class="action-btn secondary" onclick="CIMA.closeModal('documentModal')">Cancelar</button>
                <button class="action-btn" onclick="CIMA.generatePDF()">
                    <i class="fas fa-file-pdf"></i> Generar PDF
                </button>
                <button class="action-btn" onclick="CIMA.printDocument()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script type="module" src="modules/start.js"></script>
    <script type="module" src="modules/index.js"></script>
</body>
</html>
