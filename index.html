<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIMA — Sistema ORL</title>
    
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>

<div id="err"></div>

<div class="toolbar-wrapper">
  <div class="toolbar">
    
    <div class="toolbar-section-left">
        <div class="logo">
          <div class="main">CIMA</div>
          <div class="subtitle">ORL v2.0</div>
        </div>
        
        <div class="toolbar-actions">
            <button id="btnNew" class="toolbar-btn" title="Nueva Historia"><i class="bi bi-file-earmark-plus"></i> <span class="d-none-mobile">Nueva</span></button>
            <button id="btnOpen" class="toolbar-btn" title="Abrir Historia"><i class="bi bi-folder2-open"></i> <span class="d-none-mobile">Abrir</span></button>
            <button id="btnClose" class="toolbar-btn" title="Guardar Cambios"><i class="bi bi-save"></i> <span class="d-none-mobile">Guardar</span></button>
            
            <div class="v-sep"></div>

            <button id="btnAddConsulta" class="toolbar-btn"><i class="bi bi-plus-circle-dotted"></i> Consulta</button>
            <button id="btnDeleteLast" class="toolbar-btn text-danger" title="Borrar Última"><i class="bi bi-trash"></i></button>
            
            <div class="v-sep"></div>

            <button id="btnCloseStory" class="toolbar-btn btn-close-story">
                <i class="bi bi-x-lg"></i> Cerrar HC
            </button>
        </div>
    </div>
    
    <div class="toolbar-section-right">
        <button class="toolbar-btn" style="opacity:0.6;" title="Agenda (Próximamente)"><i class="bi bi-calendar-week"></i></button>
        <button class="toolbar-btn" style="opacity:0.6;" title="Facturación (Próximamente)"><i class="bi bi-receipt"></i></button>
        
        <div class="v-sep"></div>

        <div class="user-menu-container">
            <button id="btnUserAvatar" class="avatar-btn">DR</button>
            
            <div id="userDropdown" class="user-dropdown hidden animate-fade">
                <div class="dropdown-header">
                    <h4>Dr. Usuario</h4>
                    <p>Configuración General</p>
                </div>
                
                <button class="dropdown-item">
                    <i class="bi bi-layout-sidebar"></i> Sidebar / Toolbar
                </button>
                
                <div class="dropdown-item smart-switch" id="btnThemeSwitch">
                    <span style="display:flex; gap:10px;"><i class="bi bi-moon-stars"></i> Modo Oscuro</span>
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </div>

                <button class="dropdown-item">
                    <i class="bi bi-sliders"></i> Preferencias
                </button>
                
                <div style="border-top:1px solid rgba(255,255,255,0.1); margin:4px 0;"></div>
                
                <button class="dropdown-item" style="color:#ef4444;">
                    <i class="bi bi-power"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

  </div>
</div>

<div class="container">
  
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="flex:1; display:flex; align-items:center; gap:20px;">
        <i class="bi bi-person-circle" style="font-size: 2.5rem; color:var(--accent);"></i>
        <div>
            <div style="display:flex; gap:12px; align-items:baseline;">
                <h3 id="patient-header-name" style="margin:0; font-size:1.4rem; color:white;">Nuevo Paciente</h3>
                <span id="patient-age-display" class="badge" style="background:var(--accent); color:black; padding:2px 8px; border-radius:4px; font-weight:bold; font-size:0.75rem;">-- años</span>
            </div>
            <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">
                <span id="patient-doc-info">Doc: ---</span> • <span id="patient-internal-id">ID: ---</span>
            </div>
        </div>
      </div>
      <button class="patient-toggle-btn"><i class="bi bi-chevron-down"></i></button>
    </div>
    
    <div class="patient-details hidden" id="patient-form-container" style="margin-top:20px; padding-top:20px; border-top:1px solid var(--glass-border);"></div>
  </div> 

  <div id="visitsContainer"></div>

  <div id="previewBar" class="hidden">
    <div class="preview-controls">
        <i class="bi bi-zoom-out" style="color:var(--text-muted)"></i>
        <input type="range" id="zoomRange" min="40" max="130" step="5" value="70" style="width:100px;">
        <span id="zoomVal" style="color:var(--accent); font-size:0.85rem; font-weight:600; width:40px;">70%</span>
        
        <button id="btnToggleSign" class="toolbar-btn" style="border:1px solid var(--glass-border);">
            <i class="bi bi-pen"></i> Firmar
        </button>
    </div>
    <div class="preview-actions">
        <button id="btnRefresh" class="toolbar-btn"><i class="bi bi-arrow-clockwise"></i></button>
        <button id="btnOpenExport" class="toolbar-btn" style="background:var(--success); color:white; border:none;"><i class="bi bi-share-fill"></i> Exportar</button>
    </div>
  </div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>

</div> 

<div id="searchModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:var(--accent); margin-bottom:15px; font-weight:300;">Buscar Paciente</h3>
    <input id="searchValue" class="form-input" placeholder="Escriba nombre o cédula..." style="margin-bottom:15px; padding:12px;">
    <div id="searchResultsList" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
    <div style="text-align:right; display:flex; gap:10px; justify-content:flex-end;">
      <button id="btnCancelSearch" class="toolbar-btn">Cancelar</button>
      <button id="btnDoSearch" class="toolbar-btn" style="background:var(--primary); color:white;">Buscar</button>
    </div>
  </div>
</div>

<div id="exportModal" class="modal-overlay">
  <div class="modal-box glass">
    <h3 style="color:var(--accent); text-align:center; margin-bottom:5px;">Compartir Documento</h3>
    <p id="exportFileName" style="text-align:center; color:var(--text-muted); font-family:monospace; margin-bottom:25px;"></p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <button id="btnShareWA" class="toolbar-btn" style="background:#25D366; color:white; justify-content:center;"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button id="btnShareMail" class="toolbar-btn" style="background:#EA4335; color:white; justify-content:center;"><i class="bi bi-envelope-fill"></i> Email</button>
        <button id="btnDownload" class="toolbar-btn" style="background:var(--primary); color:white; grid-column:span 2; justify-content:center; padding:12px;"><i class="bi bi-download"></i> Descargar Imagen</button>
    </div>
    <div style="text-align:right; margin-top:20px;">
        <button id="btnCloseExport" class="toolbar-btn">Cerrar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "patient": "./app/services/consultation/models/ORL-001/patient.js",
    "consult": "./app/services/consultation/models/ORL-001/consult.js",
    "informe": "./app/services/consultation/models/ORL-001/informe.js",
    "recipe": "./app/services/consultation/models/ORL-001/recipe-indicaciones.js",
    "export": "./app/services/consultation/models/ORL-001/export.js"
  }
}
</script>

<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { initializeNewPatient, togglePatientDetails, updatePatientHeader, calcularCampos, toggleConditionalFields } from 'patient';

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v2.1 - UI Refactor Init...");
        await loadUserConfig();
        initToolbarEvents();
        initializeNewPatient();

        window.togglePatientDetailsGlobal = togglePatientDetails;
        window.updatePatientHeaderGlobal = updatePatientHeader;
        window.$ = $;
        
        const formContainer = document.getElementById('patientForm');
        formContainer.addEventListener('change', (e) => {
            if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) updatePatientHeader();
            if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) calcularCampos();
            if(e.target.type === 'checkbox') toggleConditionalFields();
        });
        
        document.getElementById('visitsContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.visit-toggle-btn');
            if(btn) {
                const card = btn.closest('.visit-card');
                card.querySelector('.visit-body').classList.toggle('hidden');
                const icon = btn.querySelector('i');
                if(icon.classList.contains('bi-chevron-right')) {
                    icon.classList.remove('bi-chevron-right'); icon.classList.add('bi-chevron-down');
                } else {
                    icon.classList.remove('bi-chevron-down'); icon.classList.add('bi-chevron-right');
                }
            }
            if(e.target.closest('.btn-inf')) window.openDocGlobal('INF', e.target.closest('.visit-card').id);
            if(e.target.closest('.btn-rp')) window.openDocGlobal('RP', e.target.closest('.visit-card').id);
        });
        
        toggleConditionalFields();
    });
</script>

</body>
</html>
