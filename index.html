<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CIMA — Sistema ORL</title>
    
    <link rel="stylesheet" href="app/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        /* CSS Mínimo para Modales */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1e293b; border: 1px solid #3b82f6; padding: 20px; border-radius: 12px; width: 400px; max-width: 90%; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="err"></div>

<div class="toolbar-wrapper glass">
  <div class="toolbar">
    <div class="logo">
      <div class="main">C.I.M.A.</div>
      <div class="subtitle">Coordinador Inteligente de Monitoreo Asistido</div>
    </div>
    
    <div class="toolbar-group">
      <button id="btnNew" class="toolbar-btn"><i class="bi bi-file-earmark-plus"></i> Nueva HC</button>
      <button id="btnOpen" class="toolbar-btn"><i class="bi bi-folder2-open"></i> Abrir HC</button>
      <button id="btnClose" class="toolbar-btn"><i class="bi bi-save"></i> Guardar</button>
    </div>
    
    <div class="toolbar-group">
      <button id="btnAddConsulta" class="toolbar-btn"><i class="bi bi-plus-circle"></i> Agregar Consulta</button>
      <button id="btnDeleteLast" class="toolbar-btn"><i class="bi bi-trash"></i> Eliminar Última</button>
    </div>
  </div>
</div>

<div class="container">
  
  <div id="patientForm" class="card hidden">
    <div class="patient-header" onclick="window.togglePatientDetailsGlobal()">
      <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
        <button type="button" class="patient-toggle-btn">
          <i class="bi bi-chevron-right"></i>
        </button>
        <span class="badge">PACIENTE</span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <span style="font-weight: 700; font-size: 16px; color: #60a5fa;" id="patient-header-name">Nuevo Paciente</span>
            <span style="background: rgba(96, 165, 250, 0.1); color: #93c5fd; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-family: monospace;" id="patient-internal-id">p0000001u001</span>
            <span style="background: rgba(96, 165, 250, 0.1); color: #93c5fd; padding: 2px 8px; border-radius: 6px; font-size: 11px;" id="patient-doc-info">C.I.: ---</span>
            <span style="background: rgba(96, 165, 250, 0.1); color: #93c5fd; padding: 2px 8px; border-radius: 6px; font-size: 11px;" id="patient-age-display">-- años</span>
          </div>
          <div class="patient-alerts" id="patient-alerts-container"></div>
          <div style="display: flex; gap: 16px; font-size: 10px; color: #94a3b8;">
            <span id="patient-meta-created">Creado: --/--/---- --:--</span>
            <span id="patient-meta-modified">Modificado: --/--/---- --:--</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="patient-details hidden" id="patient-form-container">
        </div>
  </div> 

  <div id="visitsContainer"></div>

  <div id="previewBar" class="hidden">
    <div class="row" style="align-items: center; padding: 10px 20px; gap: 15px; margin:0;">
      <div style="flex: 1; display:flex; align-items:center; gap:10px;">
        <label class="form-label" style="margin:0; color:white;">Zoom</label>
        <input type="range" id="zoomRange" min="40" max="130" step="5" value="70" style="width:100px;">
        <span id="zoomVal" style="font-weight:600; color:#60a5fa; font-size:0.8rem;">70%</span>
        
        <div style="border-left:1px solid #475569; padding-left:15px; margin-left:5px;">
            <button id="btnToggleSign" class="btn btn-ghost btn-small" style="color:white; border:1px solid #475569;">
                <i class="bi bi-pen"></i> Firmar
            </button>
        </div>
      </div>
      
      <div style="flex: 0 0 auto; display:flex; gap:10px;">
         <button id="btnRefresh" class="btn btn-primary btn-small"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
         <button id="btnOpenExport" class="btn btn-success btn-small"><i class="bi bi-share"></i> Exportar / Compartir</button>
      </div>
    </div>
  </div>

  <div id="previewShell" class="preview-shell hidden">
    <div id="docPreview"></div>
  </div>

</div> 

<div id="searchModal" class="modal-overlay">
  <div class="modal-box glass">
    <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #60a5fa;">Buscar Paciente</div>
    <input id="searchValue" class="form-input" placeholder="Nombre o Cédula..." style="margin-bottom: 15px;">
    <div id="searchResultsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;"></div>
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button id="btnCancelSearch" class="btn btn-ghost">Cancelar</button>
      <button id="btnDoSearch" class="btn btn-primary">Buscar</button>
    </div>
  </div>
</div>

<div id="exportModal" class="modal-overlay">
  <div class="modal-box glass" style="max-width: 500px;">
    <div style="text-align:center; margin-bottom:20px;">
        <h3 style="color:#60a5fa; margin-bottom:5px;">Compartir Documento</h3>
        <p style="font-size:0.9em; color:#ccc;" id="exportFileName">documento.png</p>
    </div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
        <button id="btnShareWA" class="btn" style="background:#25D366; color:white; justify-content:center;">
            <i class="bi bi-whatsapp"></i> WhatsApp
        </button>
        <button id="btnShareMail" class="btn" style="background:#EA4335; color:white; justify-content:center;">
            <i class="bi bi-envelope"></i> Email
        </button>
        <button id="btnDownload" class="btn btn-primary" style="grid-column:span 2; justify-content:center;">
            <i class="bi bi-download"></i> Solo Descargar
        </button>
    </div>
    
    <div style="margin-top:20px; text-align:right;">
        <button id="btnCloseExport" class="btn btn-ghost">Cerrar</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "brain": "./app/logic/brain.js",
    "toolbar": "./app/logic/toolbar.js",
    "patient": "./app/services/consultation/models/ORL-001/patient.js",
    "data": "./app/services/consultation/models/ORL-001/data.js",
    "informe": "./app/services/consultation/models/ORL-001/informe.js",
    "recipe": "./app/services/consultation/models/ORL-001/recipe-indicaciones.js",
    "export": "./app/services/consultation/models/ORL-001/export.js"
  }
}
</script>

<script type="module">
    import { $, loadUserConfig } from 'brain';
    import { initToolbarEvents } from 'toolbar';
    import { initializeNewPatient, togglePatientDetails, updatePatientHeader, calcularCampos, toggleConditionalFields } from 'patient';
    import { createVisitCard } from 'data';

    document.addEventListener('DOMContentLoaded', async () => {
        console.log("CIMA ORL v2.0 - Inicializando Modular...");
        
        await loadUserConfig();
        initToolbarEvents();
        initializeNewPatient();

        // Globales para eventos legacy
        window.togglePatientDetailsGlobal = togglePatientDetails;
        window.updatePatientHeaderGlobal = updatePatientHeader;
        window.$ = $;
        
        // Delegación de eventos para el formulario que ahora es dinámico
        const formContainer = document.getElementById('patientForm');
        formContainer.addEventListener('change', (e) => {
            // Header Update
            if(['primer_nombre','segundo_nombre','primer_apellido','segundo_apellido','documento_tipo','documento_numero'].includes(e.target.id)) {
                updatePatientHeader();
            }
            // Cálculos
            if(['fecha_nacimiento','peso_kg','talla_cm'].includes(e.target.id)) {
                calcularCampos();
            }
            // Condicionales
            if(e.target.type === 'checkbox') {
                toggleConditionalFields();
            }
        });
        
        // Delegación de eventos Visitas
        document.getElementById('visitsContainer').addEventListener('click', (e) => {
            const btn = e.target.closest('.visit-toggle-btn');
            if(btn) {
                const card = btn.closest('.visit-card');
                card.querySelector('.visit-body').classList.toggle('hidden');
                btn.querySelector('i').classList.toggle('bi-chevron-right');
                btn.querySelector('i').classList.toggle('bi-chevron-down');
            }
            if(e.target.closest('.btn-inf')) {
                const card = e.target.closest('.visit-card');
                window.openDocGlobal('INF', card.id);
            }
            if(e.target.closest('.btn-rp')) {
                const card = e.target.closest('.visit-card');
                window.openDocGlobal('RP', card.id);
            }
        });
        
        toggleConditionalFields();
    });
</script>

</body>
</html>
